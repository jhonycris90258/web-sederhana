<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Parental Control</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            margin: 0;
            padding: 20px;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #1e293b;
            color: #f8fafc;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #334155;
        }
        h2 { margin-top: 0; color: #f8fafc; text-align: center; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 25px; }
        
        /* Tabel Menu */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 14px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #0f172a;
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }
        a.btn-menu {
            display: inline-block;
            padding: 8px 16px;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        a.btn-menu:hover { background-color: #2563eb; }
        
        .logout-container {
            text-align: center;
            margin-top: 25px;
        }
        a.logout {
            color: #f87171;
            text-decoration: none;
            font-weight: bold;
        }
        a.logout:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛡️ Panel Utama Parental Control</h2>
        <p class="subtitle">Selamat datang, Admin! Silakan pilih menu pemantauan perangkat di bawah ini:</p>
        
        <table>
            <thead>
                <tr>
                    <th>Fitur Pemantauan</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>📍 <b>Lokasi Saat Ini</b></td>
                    <td><a href="/dashboard/lokasi" class="btn-menu">Buka</a></td>
                </tr>
                <tr>
                    <td>🌐 <b>Riwayat Website</b></td>
                    <td><a href="/dashboard/riwayat-web" class="btn-menu">Buka</a></td>
                </tr>
                <tr>
                    <td>🖼️ <b>Galeri Foto</b></td>
                    <td><a href="/dashboard/galeri" class="btn-menu">Buka</a></td>
                </tr>
                <tr>
                    <td>💬 <b>Pantau WhatsApp</b></td>
                    <td><a href="/dashboard/whatsapp" class="btn-menu">Buka</a></td>
                </tr>
                <tr>
                    <td>📱 <b>APK Install (Aplikasi)</b></td>
                    <td><a href="/dashboard/apk-install" class="btn-menu">Buka</a></td>
                </tr>
            </tbody>
        </table>

        <div class="logout-container">
            <a href="/" class="logout">Keluar (Logout)</a>
        </div>
    </div>

</body>
</html>
