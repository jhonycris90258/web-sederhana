<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parental Control - Login</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #f8fafc;
        }
        .container { 
            background-color: #1e293b; 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            width: 320px; 
            text-align: center; 
            border: 1px solid #334155;
        }
        h2 { color: #f8fafc; margin-bottom: 25px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            background-color: #0f172a;
            border: 1px solid #475569; 
            color: #fff;
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        input:focus { border-color: #3b82f6; outline: none; }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 15px; 
            transition: background 0.2s;
        }
        button:hover { background-color: #2563eb; }
        .link { margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .link a { color: #60a5fa; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔒 Login Admin</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Nama Pengguna" required>
            <input type="password" name="password" placeholder="Kata Sandi" required>
            <button type="submit">Masuk</button>
        </form>
        <div class="link">
            Belum punya akun? <a href="/daftar">Daftar Sekarang</a>
        </div>
    </div>
</body>
</html>
